name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip project safely
      run: |
        find . -maxdepth 1 -name "*.zip" -exec unzip -o "{}" \;
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          echo "WORK_DIR=$DIR" >> $GITHUB_ENV
        else
          echo "WORK_DIR=." >> $GITHUB_ENV
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        cd "${{ env.WORK_DIR }}"
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        cd "${{ env.WORK_DIR }}"
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClearLens-Camera-APK
        path: |
          **/build/outputs/apk/debug/*.apk
